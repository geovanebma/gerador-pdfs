<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Moderna</title>
  <link rel="icon" type="image/x-icon" href="icon.png">
  <meta name="description" content="Landing dinâmica por tema">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    [v-cloak] { display: none !important; }
    :root {
      --theme-primary: #1E1B4B;
      --theme-on-primary: #ffffff;
      --theme-rgb: 30,27,75;
      --bg: #ffffff;
      --ink: #0b1220;
      --muted: #51627c;
      --line: #e5e7eb;
      --radius: 16px;
      --container: 1160px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Roboto", system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .container { width: min(var(--container), 92vw); margin: 0 auto; }

    .state {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #fff;
    }
    .state-card {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 20px;
    }
    .state-card p { color: var(--muted); }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 12px;
      border-radius: 50%;
      border: 3px solid #dbe4f3;
      border-top-color: var(--theme-primary);
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-weight: 800;
      cursor: pointer;
      transition: .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: var(--theme-primary);
      color: var(--theme-on-primary);
      box-shadow: 0 12px 24px rgba(var(--theme-rgb), .25);
    }
    .btn-ghost {
      background: #fff;
      border-color: #d7dce7;
      color: var(--ink);
    }

    .warning {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff8de;
      color: #7a5b00;
      border-bottom: 1px solid #f0de9e;
      padding: 9px 14px;
      font-size: .9rem;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .topbar-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar .btn {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 11px;
      display: grid; place-items: center;
      color: var(--theme-on-primary);
      background: var(--theme-primary);
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .brand-meta { min-width: 0; }
    .brand-meta .kicker {
      margin: 0;
      font-size: .73rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 800;
    }
    .brand-meta .name {
      margin: 2px 0 0;
      font-size: 1rem;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section {
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 38px 0;
      border-bottom: 1px solid var(--line);
    }
    .section-theme {
      background:
        linear-gradient(180deg, rgba(var(--theme-rgb), .97), rgba(var(--theme-rgb), .9)),
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.18), transparent 45%);
      color: #fff;
      border-bottom: 0;
    }
    .section-black {
      background: #0b0f17;
      color: #f5f7fb;
      border-bottom: 0;
    }
    .section h2 {
      margin: 0 0 10px;
      font-size: clamp(1.9rem, 4.8vw, 3.1rem);
      line-height: 1.02;
      letter-spacing: -.03em;
    }
    /* Títulos em seções com fundo branco/preto ficam na cor tema */
    .section:not(.section-theme) h2 {
      color: var(--theme-primary);
    }
    .lead {
      margin: 0;
      color: var(--muted);
      max-width: 64ch;
      font-size: clamp(1rem, 1.3vw, 1.18rem);
      line-height: 1.7;
    }
    .section-theme .lead,
    .section-black .lead { color: rgba(255,255,255,.84); }

    .hero-grid {
      display: grid;
      grid-template-columns: .96fr 1.04fr;
      gap: 18px;
      align-items: center;
    }
    .hero-kicker {
      margin: 0 0 8px;
      font-size: .83rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 800;
      color: rgba(255,255,255,.82);
    }
    .hero-title {
      margin: 0 0 14px;
      font-size: clamp(1.6rem, 4.3vw, 2.8rem);
      line-height: .92;
      letter-spacing: -.035em;
      max-width: 14ch;
    }
    .hero-grid .lead {
      font-size: clamp(.95rem, 1.1vw, 1.02rem);
      line-height: 1.45;
      max-width: 56ch;
    }
    .cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .trust-line { margin-top: 12px; font-size: .93rem; color: rgba(255,255,255,.84); }

    .hero-mockups {
      position: relative;
      min-height: 360px;
      display: grid;
      place-items: center;
    }
    .mock-desktop {
      width: min(540px, 100%);
      background: #fff;
      border: 1px solid #d9ddea;
      border-radius: 16px;
      box-shadow: 0 26px 54px rgba(0,0,0,.32);
      overflow: hidden;
      transform: rotate(-1deg);
    }
    .mock-header {
      height: 30px;
      background: #eef2fb;
      border-bottom: 1px solid #dde3f1;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
    }
    .mock-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #c1cadc;
    }
    .mock-screen img {
      width: 100%;
      height: 300px;
      object-fit: contain;
      background: #fff;
    }
    .mock-tablet {
      position: absolute;
      right: 0;
      bottom: -16px;
      width: 175px;
      background: #fff;
      border: 1px solid #d9ddea;
      border-radius: 18px;
      box-shadow: 0 18px 36px rgba(0,0,0,.25);
      overflow: hidden;
      transform: rotate(9deg);
    }
    .mock-tablet img {
      width: 100%;
      height: 230px;
      object-fit: contain;
      background: #fff;
    }

    .stats-band {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
    }
    .stat {
      padding: 10px 8px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,.2);
    }
    .stat:last-child { border-right: 0; }
    .stat strong {
      display: block;
      font-size: clamp(1rem, 1.9vw, 1.45rem);
      line-height: 1.02;
      margin-bottom: 4px;
      color: #fff;
    }
    .stat span { font-size: .88rem; color: rgba(255,255,255,.84); }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 1.08rem;
      line-height: 1.2;
    }
    .card p { margin: 0; color: var(--muted); }
    .bullet-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }
    .bullet-list li { margin-bottom: 7px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

    .method-row {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid #d9deea;
      border-radius: 12px;
      background: #fff;
    }
    .method-code {
      width: 56px; height: 56px;
      display: grid; place-items: center;
      border-radius: 12px;
      background: rgba(var(--theme-rgb), .12);
      color: var(--theme-primary);
      font-weight: 900;
      font-size: 1.25rem;
    }
    .method-row p { margin: 4px 0 0; color: var(--muted); }

    .chapter-carousel { margin-top: 14px; margin-bottom: 40px; }
    .chapter-carousel .carousel-item { padding: 2px 34px; }
    .chapter-carousel .carousel-indicators { margin-bottom: -16px; }
    .chapter-carousel .carousel-indicators [data-bs-target] {
      background-color: rgba(255,255,255,.8);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 0;
    }
    .chapter-carousel .carousel-control-prev,
    .chapter-carousel .carousel-control-next {
      width: 30px;
      opacity: .9;
    }
    .chapter-carousel .carousel-control-prev-icon,
    .chapter-carousel .carousel-control-next-icon {
      width: 24px;
      height: 24px;
      filter: invert(1);
    }
    .chapter-slide-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .chapter-card {
      min-height: 170px;
    }
    .chapter-card h4 { margin: 0 0 8px; font-size: 1rem; line-height: 1.25; color: var(--ink); }
    .chapter-card p { margin: 0; color: var(--muted); font-size: .94rem; }
    .chapter-note {
      margin-top: 26px;
      color: rgba(255,255,255,.78);
      font-size: .92rem;
    }

    .offer-grid {
      display: grid;
      grid-template-columns: 1.06fr .94fr;
      gap: 16px;
      align-items: start;
    }
    .offer-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed #d7ddea;
    }
    .offer-line:last-child { border-bottom: 0; }
    .offer-line span:first-child { color: var(--muted); }
    .offer-line span:last-child { font-weight: 800; }
    .offer-price {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(var(--theme-rgb), .22);
      background: rgba(var(--theme-rgb), .08);
    }
    .offer-price .old { margin: 0; text-decoration: line-through; color: #64748b; }
    .offer-price .new {
      margin: 4px 0 0;
      font-size: 2rem;
      line-height: 1;
      font-weight: 900;
      color: var(--theme-primary);
    }
    .offer-price .note { margin: 8px 0 0; color: var(--muted); font-size: .9rem; }

    .bonus-item {
      border: 1px solid #d8deeb;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .bonus-item + .bonus-item { margin-top: 10px; }
    .bonus-item p { margin: 5px 0 0; color: var(--muted); }

    .preview-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .preview-grid img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #d5dbe8;
      background: #fff;
    }
    .intro-preview-main {
      border: 1px solid #d5dbe8;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      max-width: 380px;
      margin-top: 10px;
    }
    .intro-preview-main img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      max-height: 460px;
    }
    .intro-lead {
      margin-top: 18px;
      margin-bottom: 10px;
    }

    details.faq-item {
      background: #fff;
      border: 1px solid #d8deeb;
      border-radius: 12px;
      padding: 11px 12px;
    }
    details.faq-item + details.faq-item { margin-top: 10px; }
    details summary { cursor: pointer; font-weight: 800; color: var(--ink); }
    details p { margin: 8px 0 0; color: var(--muted); }
    .section-theme details.faq-item summary { color: var(--ink); }
    .section-theme details.faq-item p { color: var(--muted); }
    .section-theme details.faq-item { background: #fff; }

    .testi-item {
      border: 1px solid #d8deeb;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .testi-item p {
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
    }
    .testi-item strong {
      display: inline-block;
      margin-top: 8px;
      font-size: .9rem;
      color: #0f172a;
    }

    .mini-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .legal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 18px;
    }
    .legal-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }
    .legal-card h4 { margin: 0 0 8px; font-size: .95rem; color: var(--ink); }
    .legal-card p { margin: 0; color: var(--muted); font-size: .88rem; }
    .legal-card a {
      display: inline-block;
      margin-top: 8px;
      color: var(--theme-primary);
      font-weight: 700;
      border-bottom: 1px solid rgba(var(--theme-rgb), .35);
    }
    .support-row {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: .92rem;
    }
    .support-row span { display: inline-flex; align-items: center; gap: 6px; }

    .section-black .legal-card {
      border-color: rgba(255,255,255,.14);
      background: rgba(255,255,255,.03);
    }
    .section-black .legal-card h4 { color: #fff; }
    .section-black .legal-card p { color: rgba(255,255,255,.74); }
    .section-black .legal-card a {
      color: #fff;
      border-bottom-color: rgba(255,255,255,.45);
    }
    .section-black .support-row { color: rgba(255,255,255,.82); }

    .catalog {
      padding: 34px 0 56px;
      background: #fff;
    }
    .catalog h1 {
      margin: 0;
      font-size: clamp(1.9rem, 4.5vw, 3rem);
      line-height: 1.04;
      letter-spacing: -.02em;
    }
    .catalog p { color: var(--muted); }
    .catalog-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .catalog-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      text-align: left;
      background: #fff;
      cursor: pointer;
      transition: .15s ease;
    }
    .catalog-card:hover { transform: translateY(-2px); border-color: #cbd5e1; }
    .catalog-cover {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      background: #f8fafc;
    }
    .catalog-cover img { width: 100%; height: 100%; object-fit: cover; }
    .catalog-title { margin: 10px 0 2px; font-size: 1rem; font-weight: 900; line-height: 1.2; }
    .catalog-sub { margin: 0; color: var(--muted); font-size: .9rem; }
    .catalog-meta {
      margin-top: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: .76rem;
      color: var(--muted);
      background: #fff;
    }

    @media (max-width: 1080px) {
      .section {
        height: auto;
        min-height: auto;
        max-height: none;
        overflow: visible;
        padding: 54px 0;
      }
      .hero-grid, .offer-grid { grid-template-columns: 1fr; }
      .mock-tablet { display: none; }
      .stats-band { grid-template-columns: 1fr 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr; }
      .legal-grid { grid-template-columns: 1fr 1fr; }
      .intro-preview-main { max-width: 340px; }
      .intro-preview-main img { max-height: 420px; }
    }
    @media (min-width: 1081px) and (max-height: 760px) {
      .section {
        padding: 20px 0;
      }
      .topbar-inner { height: 62px; }
      .hero-title { font-size: clamp(1.45rem, 3.2vw, 2.35rem); }
      .hero-grid .lead { font-size: .95rem; line-height: 1.38; }
      .hero-mockups { min-height: 310px; }
      .mock-screen img { height: 250px; }
      .mock-tablet { width: 145px; }
      .mock-tablet img { height: 190px; }
      .stats-band { margin-top: 12px; }
      .stat { padding: 8px 6px; }
      .stat strong { font-size: clamp(.95rem, 1.5vw, 1.25rem); }
      .stat span { font-size: .8rem; }
      .cta-row { margin-top: 10px; }
      .trust-line { margin-top: 8px; font-size: .86rem; }
    }
    @media (max-width: 720px) {
      .section { padding: 56px 0; }
      .section h2 {
        font-size: clamp(1.55rem, 8.2vw, 2.15rem);
        line-height: 1.08;
      }
      .topbar-inner {
        height: auto;
        min-height: 64px;
        padding: 8px 0;
        gap: 10px;
      }
      .topbar .btn {
        min-height: 38px;
        padding: 8px 12px;
        font-size: .95rem;
        border-radius: 10px;
      }
      .brand-icon {
        width: 38px;
        height: 38px;
      }
      .brand-meta .kicker {
        display: none;
      }
      .brand-meta .name {
        max-width: 160px;
        font-size: .95rem;
      }
      .hero-title { font-size: clamp(1.9rem, 10vw, 3rem); }
      .stats-band { grid-template-columns: 1fr; }
      .grid-2, .grid-3, .preview-grid, .legal-grid, .chapter-slide-grid { grid-template-columns: 1fr; }
      .mock-screen img { height: 300px; }
      .intro-preview-main {
        max-width: 300px;
        margin-top: 8px;
      }
      .intro-preview-main img { max-height: 360px; }
    }
    @media (max-width: 420px) {
      .topbar .btn {
        padding: 7px 10px;
        font-size: .88rem;
      }
      .brand-meta .name {
        max-width: 120px;
        font-size: .9rem;
      }
      .intro-preview-main {
        max-width: 275px;
      }
      .intro-preview-main img { max-height: 320px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div v-cloak :style="cssVars">
      <div v-if="loading" class="state">
        <div class="state-card">
          <div class="spinner"></div>
          <h2>Carregando...</h2>
          <p>Aplicando tema e oferta.</p>
        </div>
      </div>

      <div v-else-if="error" class="state">
        <div class="state-card">
          <h2>Erro ao carregar landing</h2>
          <p>{{ error }}</p>
          <button class="btn btn-primary" @click="init">Tentar novamente</button>
        </div>
      </div>

      <template v-else-if="showCatalog">
        <section class="catalog">
          <div class="container">
            <h1>Escolha um e-book</h1>
            <p>Clique e abra a versão com ID na URL.</p>
            <div class="catalog-grid">
              <button type="button" class="catalog-card" v-for="item in catalogItems" :key="`cat-${item.id}`" @click="goToTheme(item.id)">
                <div class="catalog-cover">
                  <img v-if="item.coverUrl" :src="item.coverUrl" :alt="item.nome">
                </div>
                <h3 class="catalog-title">{{ item.nome }}</h3>
                <p class="catalog-sub">{{ item.subtitulo || 'Produto digital' }}</p>
                <div class="catalog-meta">
                  <span class="chip">ID {{ item.id }}</span>
                  <span class="chip">{{ item.chapterCount }} capítulos</span>
                </div>
              </button>
            </div>
          </div>
        </section>
      </template>

      <template v-else-if="theme && offer">
        <div v-if="warning" class="warning">{{ warning }}</div>

        <header class="topbar">
          <div class="container topbar-inner">
            <div class="brand">
              <div class="brand-icon"><i :class="theme.icone || 'bi-book'"></i></div>
              <div class="brand-meta">
                <p class="kicker">{{ offer.brandKicker || theme.principal }}</p>
                <p class="name">{{ offer.brandName || theme.nome }}</p>
              </div>
            </div>
            <a class="btn btn-primary" :href="offer.checkoutUrl || '#oferta'" target="_blank" rel="noopener">{{ offer.ctaPrimary || 'Comprar agora' }}</a>
          </div>
        </header>

        <main>
          <section class="section section-theme">
            <div class="container hero-grid">
              <div class="hero-mockups">
                <div class="mock-desktop">
                  <div class="mock-header">
                    <span class="mock-dot"></span><span class="mock-dot"></span><span class="mock-dot"></span>
                  </div>
                  <div class="mock-screen">
                    <img v-if="coverPngUrl" :src="coverPngUrl" :alt="`Capa de ${theme.nome}`">
                  </div>
                </div>
                <div class="mock-tablet">
                  <img v-if="coverPngUrl" :src="coverPngUrl" :alt="`Capa tablet ${theme.nome}`">
                </div>
              </div>

              <div>
                <p class="hero-kicker">{{ theme.principal }}</p>
                <h1 class="hero-title">{{ offer.headline || theme.nome }}</h1>
                <p class="lead">{{ offer.subheadline || theme.subtitulo }}</p>

                <div class="cta-row">
                  <a class="btn btn-primary" :href="offer.checkoutUrl || '#oferta'" target="_blank" rel="noopener">{{ offer.ctaPrimary || 'Comprar agora' }}</a>
                  <a class="btn btn-ghost" href="#metodo">{{ offer.ctaSecondary || 'Ver como funciona' }}</a>
                </div>

                <p class="trust-line" v-if="offer.trustBadges && offer.trustBadges.length">
                  <span v-for="(badge, idx) in offer.trustBadges" :key="`trust-${idx}`">
                    {{ typeof badge === 'object' ? badge.text : badge }}<span v-if="idx < offer.trustBadges.length - 1"> • </span>
                  </span>
                </p>

                <div class="stats-band">
                  <div class="stat">
                    <strong>{{ offer.socialRating?.texto || '1.200+' }}</strong>
                    <span>Leitoras</span>
                  </div>
                  <div class="stat">
                    <strong>{{ offer.socialRating?.nota || '4,8/5' }}</strong>
                    <span>Avaliação média</span>
                  </div>
                  <div class="stat">
                    <strong>{{ chapterTitles.length }}</strong>
                    <span>Capítulos</span>
                  </div>
                  <div class="stat">
                    <strong>{{ (offer.bonuses && offer.bonuses.length) || 0 }}</strong>
                    <span>Bônus</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="metodo" class="section">
            <div class="container">
              <h2>{{ offer.method?.name || 'Método principal' }}</h2>
              <p class="lead">Quatro passos simples para sair da repetição e entrar em decisões amorosas conscientes.</p>
              <div class="grid-2" style="margin-top:14px;">
                <article class="method-row" v-for="(step, i) in (offer.method?.steps || [])" :key="`m-${i}`">
                  <div class="method-code">{{ step.code || i + 1 }}</div>
                  <div>
                    <strong>{{ step.title }}</strong>
                    <p>{{ step.desc }}</p>
                  </div>
                </article>
              </div>
            </div>
          </section>

          <section id="conteudo" class="section section-black">
            <div class="container">
              <h2>O que você vai aprender</h2>
              <p class="lead">Sem excesso de teoria: capítulos objetivos, exemplos reais e aplicação prática.</p>

              <div class="chapter-carousel" v-if="chapterSlides.length">
                <div id="chapterCarousel" class="carousel slide" data-bs-ride="false">
                  <div class="carousel-indicators" v-if="chapterSlides.length > 1">
                    <button
                      v-for="(slide, i) in chapterSlides"
                      :key="`chap-ind-${i}`"
                      type="button"
                      data-bs-target="#chapterCarousel"
                      :data-bs-slide-to="i"
                      :class="{ active: i === 0 }"
                      :aria-label="`Slide ${i + 1}`"
                      :aria-current="i === 0 ? 'true' : null"
                    ></button>
                  </div>

                  <div class="carousel-inner">
                    <div
                      class="carousel-item"
                      v-for="(slide, sIdx) in chapterSlides"
                      :key="`chap-slide-${sIdx}`"
                      :class="{ active: sIdx === 0 }"
                    >
                      <div class="chapter-slide-grid">
                        <article class="card chapter-card" v-for="(c, cIdx) in slide" :key="`c-${sIdx}-${cIdx}`">
                          <h4>{{ (sIdx * 4) + cIdx + 1 }}. {{ c.title }}</h4>
                          <p>{{ c.summary }}</p>
                        </article>
                      </div>
                    </div>
                  </div>

                  <button v-if="chapterSlides.length > 1" class="carousel-control-prev" type="button" data-bs-target="#chapterCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                  </button>
                  <button v-if="chapterSlides.length > 1" class="carousel-control-next" type="button" data-bs-target="#chapterCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                  </button>
                </div>
              </div>
              <p class="chapter-note">Deslize para ver todos os capítulos. Você recebe o conteúdo completo no PDF (todos os capítulos + exercícios).</p>
            </div>
          </section>

          <section class="section section-theme">
            <div class="container">
              <h2>Prévia da Introdução</h2>
              <p class="lead intro-lead">Veja um recorte real do material antes de comprar.</p>

              <div class="intro-preview-main" v-if="previewUrls && previewUrls.length">
                <img :src="previewUrls[0]" alt="Prévia da introdução">
              </div>
              <div class="preview-grid" v-if="previewUrls && previewUrls.length > 1">
                <img v-for="(src, i) in previewUrls.slice(1)" :key="`pv-${i}`" :src="src" :alt="`Prévia adicional ${i + 1}`">
              </div>
            </div>
          </section>

          <section class="section">
            <div class="container grid-2">
              <div class="card">
                <h3>Benefícios imediatos</h3>
                <ul class="bullet-list">
                  <li v-for="(item, i) in benefitsPreview" :key="`bn-${i}`">{{ item }}</li>
                </ul>
              </div>
              <div class="card">
                <h3>Prova social</h3>
                <article class="testi-item" v-for="(t, i) in testimonialsPreview" :key="`ts-${i}`">
                  <p>"{{ t.quote }}"</p>
                  <strong>{{ t.name }}</strong>
                </article>
              </div>
            </div>
          </section>

          <section id="oferta" class="section section-black">
            <div class="container offer-grid">
              <div class="card">
                <h3>{{ offer.brandName || theme.nome }}</h3>
                <p class="lead" style="font-size:1rem; max-width:none;">{{ offer.offerDescription || 'Diagnóstico em PDF com plano de ação.' }}</p>

                <div style="margin-top:10px;">
                  <div class="offer-line" v-for="(item, i) in (offer.offerItems || [])" :key="`of-${i}`">
                    <span>{{ item.label }}</span>
                    <span>{{ item.value }}</span>
                  </div>
                </div>

                <div class="offer-price">
                  <p class="old" v-if="offer.anchoredPrice">{{ offer.anchoredPrice }}</p>
                  <p class="new">{{ offer.price || 'R$ 37,00' }}</p>
                  <p class="note">{{ offer.paymentNote || 'Acesso imediato após pagamento.' }}</p>
                </div>

                <div class="mini-cta">
                  <a class="btn btn-primary" :href="offer.checkoutUrl || '#'" target="_blank" rel="noopener">{{ offer.ctaPrimary || 'Comprar agora' }}</a>
                </div>
              </div>

              <div class="card">
                <h3>Bônus que acompanham</h3>
                <article class="bonus-item" v-for="(b, i) in (offer.bonuses || [])" :key="`bonus-${i}`">
                  <strong>{{ b.title }} <span v-if="b.value">({{ b.value }})</span></strong>
                  <p>{{ b.desc }}</p>
                </article>
              </div>
            </div>
          </section>

          <section id="faq" class="section section-theme">
            <div class="container grid-2">
              <div>
                <h2>Perguntas frequentes</h2>
                <p class="lead">Respostas curtas para reduzir objeções e facilitar a decisão.</p>
              </div>
              <div>
                <details class="faq-item" v-for="(f, i) in faqPreview" :key="`faq-${i}`">
                  <summary>{{ f.q }}</summary>
                  <p>{{ f.a }}</p>
                </details>
              </div>
            </div>
          </section>

          <section id="final" class="section">
            <div class="container">
              <h2>{{ offer.finalCtaTitle || theme.nome }}</h2>
              <p class="lead">{{ offer.finalCtaText || theme.subtitulo }}</p>
              <div class="mini-cta">
                <a class="btn btn-primary" :href="offer.checkoutUrl || '#'" target="_blank" rel="noopener">{{ offer.ctaPrimary || 'Comprar agora' }}</a>
              </div>

              <div class="legal-grid">
                <article class="legal-card" v-if="offer.legalPages?.termosDeUso">
                  <h4>{{ offer.legalPages.termosDeUso.titulo || 'Termos de Uso' }}</h4>
                  <p>{{ offer.legalPages.termosDeUso.resumo || '' }}</p>
                  <a :href="offer.legalPages.termosDeUso.url || '#'" target="_blank" rel="noopener">Ler termos</a>
                </article>
                <article class="legal-card" v-if="offer.legalPages?.politicaDePrivacidade">
                  <h4>{{ offer.legalPages.politicaDePrivacidade.titulo || 'Política de Privacidade' }}</h4>
                  <p>{{ offer.legalPages.politicaDePrivacidade.resumo || '' }}</p>
                  <a :href="offer.legalPages.politicaDePrivacidade.url || '#'" target="_blank" rel="noopener">Ler política</a>
                </article>
                <article class="legal-card" v-if="offer.legalPages?.politicaDeReembolso">
                  <h4>{{ offer.legalPages.politicaDeReembolso.titulo || 'Política de Reembolso' }}</h4>
                  <p>{{ offer.legalPages.politicaDeReembolso.resumo || '' }}</p>
                  <a :href="offer.legalPages.politicaDeReembolso.url || '#'" target="_blank" rel="noopener">Ler política</a>
                </article>
                <article class="legal-card" v-if="offer.legalPages?.avisoLegal">
                  <h4>{{ offer.legalPages.avisoLegal.titulo || 'Aviso Legal' }}</h4>
                  <p>{{ offer.legalPages.avisoLegal.resumo || '' }}</p>
                  <a :href="offer.legalPages.avisoLegal.url || '#'" target="_blank" rel="noopener">Ler aviso</a>
                </article>
              </div>

              <div class="support-row">
                <span v-if="offer.contact?.emailSuporte"><i class="bi bi-envelope"></i>{{ offer.contact.emailSuporte }}</span>
                <span v-if="offer.contact?.horarioAtendimento"><i class="bi bi-clock"></i>{{ offer.contact.horarioAtendimento }}</span>
                <span><i class="bi bi-headset"></i>Help / Suporte</span>
              </div>
            </div>
          </section>
        </main>
      </template>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="./app.js"></script>
</body>
</html>
